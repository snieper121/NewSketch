name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --build-cache --no-daemon 2>&1 | tee build-log.txt

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: build-log.txt

  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --build-cache --no-daemon 2>&1 | tee assemble-log.txt

      - name: Show APK output
        run: |
          echo "=== APK files ==="
          find app/build/outputs -name "*.apk" -type f > apk-files.txt || true
          cat apk-files.txt || echo "No APK found"
          echo "=== All outputs ==="
          ls -laR app/build/outputs/ || echo "Directory not found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APK file list
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-list
          path: apk-files.txt

      - name: Show assemble log
        if: always()
        run: cat assemble-log.txt | tail -100

      - name: Upload assemble logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assemble-logs
          path: assemble-log.txt

      - name: Print APK info
        run: |
          echo "========================================"
          echo "📱 Debug APK собран!"
          echo ""
          echo "⬇️  Скачать APK (ZIP): https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo ""
          echo "В разделе 'Artifacts' найди: app-debug"
          echo "========================================"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew test --build-cache --no-daemon 2>&1 | tee test-log.txt

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: test-log.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: |
          set -o pipefail
          ./gradlew lint --build-cache --no-daemon 2>&1 | tee lint-log.txt

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html

      - name: Upload lint logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-logs
          path: lint-log.txt
